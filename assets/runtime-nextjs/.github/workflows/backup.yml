name: Database backup

# Una aplicación que es fuente de verdad necesita una copia recuperable propia.
# El respaldo del proveedor, cuando existe, es del proveedor: esto es tuyo.
#
# Requiere un único secreto en el repositorio: DATABASE_URL_DIRECT, la conexión
# sin pooler (en Supabase, "Direct connection"; el pooler no sirve para pg_dump).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      # El volcado no necesita el repositorio, pero el vencimiento de la auditoría corre
      # un script que vive acá. Sin esto el respaldo se hacía y el paso siguiente moría
      # con "Cannot find module", así que el flujo terminaba en rojo todos los días
      # aunque la copia estuviera bien hecha.
      - uses: actions/checkout@v4

      - name: Dump the database
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          if [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "Falta el secreto DATABASE_URL_DIRECT." >&2
            exit 1
          fi
          mkdir -p backup
          # La versión del cliente debe coincidir con la del servidor, así que se usa
          # la imagen oficial en vez del cliente que traiga el runner.
          docker run --rm -e PGCONNECT_TIMEOUT=30 -v "$PWD/backup:/backup" postgres:17 \
            pg_dump "$DATABASE_URL_DIRECT" \
              --no-owner --no-privileges --clean --if-exists \
              --file=/backup/dump.sql
          gzip -9 backup/dump.sql

      - name: Verify the dump is usable
        run: |
          size=$(stat -c%s backup/dump.sql.gz)
          echo "Tamaño comprimido: $size bytes"
          # Un dump sano nunca es diminuto: si lo es, la conexión falló o la base está vacía.
          if [ "$size" -lt 2000 ]; then
            echo "El respaldo es sospechosamente chico. Revisá la conexión antes de confiar en él." >&2
            exit 1
          fi
          # Un dump truncado no termina con la línea de cierre de pg_dump.
          if ! zcat backup/dump.sql.gz | tail -5 | grep -q "PostgreSQL database dump complete"; then
            echo "El respaldo está truncado: no llegó al final del volcado." >&2
            exit 1
          fi
          zcat backup/dump.sql.gz | grep -c "CREATE TABLE" | xargs echo "Tablas en el respaldo:"

      # Recién ahora, con el volcado ya guardado, se vence la auditoría vieja. El orden
      # importa: si la purga corriera antes, un respaldo fallido dejaría los eventos
      # borrados y sin copia.
      - name: Age out old audit events
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          # Opcional, y necesario cuando el proveedor firma con su propia autoridad
          # (Supabase, entre otros): `pg_dump` no verifica el certificado, pero este paso
          # se conecta desde Node y sí lo hace, así que sin el certificado corta con
          # SELF_SIGNED_CERT_IN_CHAIN. Es un certificado público, no un secreto; se guarda
          # como secreto sólo porque es la forma cómoda de pasarle un PEM al flujo.
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: |
          node --version
          npm install pg@8 --no-save --silent
          DATABASE_URL="$DATABASE_URL_DIRECT" node scripts/prune-audit.mjs

      - name: Store the backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup/dump.sql.gz
          retention-days: 90
          if-no-files-found: error
