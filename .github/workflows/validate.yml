name: Validate factory

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run compiler tests
        run: |
          python scripts/test_scaffold.py
          python scripts/test_evolve_app.py
          python scripts/test_update_platform.py
          python scripts/test_blocks.py
          python scripts/test_version_bump.py
      # El actualizador se prueba contra la historia real: una aplicación generada con la
      # plataforma de main tiene que poder subir a la de esta rama y seguir verificando.
      - name: An application generated from main updates to this platform
        run: |
          git fetch --depth=1 origin main
          git worktree add /tmp/factory-main FETCH_HEAD
          python /tmp/factory-main/scripts/scaffold_app.py --spec /tmp/factory-main/references/example-maintenance.app-spec.json --output /tmp/old-app
          git -C /tmp/old-app init -q
          git -C /tmp/old-app add -A
          git -C /tmp/old-app -c user.name=ci -c user.email=ci@example.com commit -qm base
          cp /tmp/old-app/platform-manifest.json /tmp/main-manifest.json
          python scripts/update_platform.py --project /tmp/old-app --apply
          python scripts/verify_scaffold.py /tmp/old-app
          python scripts/check_platform.py --project /tmp/old-app
      - name: Generate and verify the reference application
        run: |
          python scripts/scaffold_app.py --spec references/example-maintenance.app-spec.json --output /tmp/reference-app
          python scripts/verify_scaffold.py /tmp/reference-app
      # Si la plataforma cambió respecto de main, la versión tiene que subir: es lo único
      # que dice qué tiene instalado cada aplicación.
      - name: The platform version moves when the platform changes
        run: python scripts/check_version_bump.py --base /tmp/main-manifest.json --head /tmp/reference-app/platform-manifest.json
      # La guarda decide si un despliegue puede borrar datos. Si se rompe en silencio,
      # se rompe hacia el lado peligroso: deja pasar.
      - name: The destructive-migration guard holds
        working-directory: /tmp/reference-app
        run: node scripts/test-destructive-guard.mjs
      # Un control de seguridad sin prueba automatizada se rompe sin que nadie se entere.
      - name: Record-level access fails closed
        working-directory: /tmp/reference-app
        run: node scripts/test-record-access.mjs

  runtime:
    # The compiler tests never execute the generated TypeScript. Without this job a
    # runtime change can break every future application while CI stays green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate the reference application
        run: python scripts/scaffold_app.py --spec references/example-maintenance.app-spec.json --output /tmp/reference-app
      - name: Install generated dependencies
        working-directory: /tmp/reference-app
        run: pnpm install --frozen-lockfile
      - name: Typecheck the generated application
        working-directory: /tmp/reference-app
        run: pnpm typecheck
      # Las instrucciones son lo primero que recibe cualquier IA que se conecta. Si un rol
      # recibe las de otro, la plataforma le explica a alguien un trabajo que no es suyo.
      - name: MCP server instructions compose per role
        working-directory: /tmp/reference-app
        run: node --experimental-strip-types scripts/test-mcp-instructions.mjs
      # Sin marca, el cliente pide confirmación hasta para leer; con una marca equivocada, una
      # herramienta que escribe se ejecuta sin preguntar.
      - name: Every MCP tool declares what it does with the data
        working-directory: /tmp/reference-app
        run: node scripts/test-mcp-annotations.mjs
      # El motor de procesos decide con la definición si un pedido abre, si una etapa
      # cierra y adónde va el caso. Un error acá deja trabajo mal controlado sin avisar.
      - name: Process definitions validate, close and guide
        working-directory: /tmp/reference-app
        run: node --experimental-strip-types scripts/test-process-definition.mjs
      # El tablero mide con la bitácora: un error acá hace que se mejore la etapa equivocada.
      - name: The work dashboard measures from the log
        working-directory: /tmp/reference-app
        run: node --experimental-strip-types scripts/test-process-metrics.mjs
      - name: Build the generated application
        working-directory: /tmp/reference-app
        run: pnpm build

  database:
    # A migration that does not apply is a migration that does not exist. This runs the
    # real schema against a real PostgreSQL and exercises CRUD on every generated entity.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate the reference application
        run: python scripts/scaffold_app.py --spec references/example-maintenance.app-spec.json --output /tmp/reference-app
      - name: Install generated dependencies
        working-directory: /tmp/reference-app
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        working-directory: /tmp/reference-app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: pnpm db:apply
      - name: Migrations are idempotent and checksum-verified
        working-directory: /tmp/reference-app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: pnpm db:apply
      - name: Smoke every generated entity
        working-directory: /tmp/reference-app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: pnpm db:smoke

      # La matriz de alcance ejerce el repositorio real con dos identidades distintas
      # contra esta base. Es la unica prueba que responde "puede Ana ver lo de Bruno":
      # las que leen el codigo fuente comprueban que el filtro este escrito, no que filtre.
      - name: Record-level access behaves (A/B against PostgreSQL)
        working-directory: /tmp/reference-app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: pnpm db:access
      # La prueba que importa de la guarda no es que analice SQL: es que frene un
      # despliegue real contra datos reales, y que no frene cuando no hay nada que
      # perder. Las dos mitades, contra PostgreSQL.
      - name: A migration that drops an EMPTY table still deploys
        working-directory: /tmp/reference-app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: |
          node -e "const pg=require('pg');(async()=>{const c=new pg.Client(process.env.DATABASE_URL);await c.connect();await c.query('CREATE TABLE descartable (id int)');await c.end();})()"
          echo 'DROP TABLE IF EXISTS descartable;' > database/custom/500_descartar_vacia.sql
          pnpm db:apply
      - name: A migration that drops a table WITH DATA is refused
        working-directory: /tmp/reference-app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: |
          node -e "const pg=require('pg');(async()=>{const c=new pg.Client(process.env.DATABASE_URL);await c.connect();await c.query('CREATE TABLE valiosa (id int)');await c.query('INSERT INTO valiosa VALUES (1)');await c.end();})()"
          echo 'DROP TABLE IF EXISTS valiosa;' > database/custom/501_descartar_con_datos.sql
          if pnpm db:apply; then
            echo "La guarda dejo pasar una migracion que borra datos."
            exit 1
          fi
          node -e "const pg=require('pg');(async()=>{const c=new pg.Client(process.env.DATABASE_URL);await c.connect();const r=await c.query('SELECT count(*)::int AS n FROM valiosa');if(r.rows[0].n!==1)throw new Error('Los datos no sobrevivieron al intento.');await c.end();console.log('Los datos siguen ahi.')})()"
      - name: The same migration applies once a person authorizes it by name
        working-directory: /tmp/reference-app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
          ALLOW_DESTRUCTIVE_MIGRATIONS: custom/501_descartar_con_datos.sql
        run: pnpm db:apply

  evolution:
    # Una evolución que rompe los datos existentes es peor que no tener evolución.
    # Este job aplica la v1, carga datos, evoluciona el esquema y comprueba que los
    # datos siguen ahí.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate v1 and apply it
        run: |
          python scripts/scaffold_app.py --spec references/example-maintenance.app-spec.json --output /tmp/evolving-app
          cd /tmp/evolving-app
          pnpm install --frozen-lockfile
          pnpm db:apply

      - name: Load data that must survive the evolution
        run: |
          cd /tmp/evolving-app
          node -e "
            const pg = require('pg');
            (async () => {
              const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              await c.query(\"INSERT INTO equipment (name, status) VALUES ('bomba-1', 'active')\");
              await c.end();
            })();
          "

      - name: Evolve the schema
        run: |
          python - <<'SPEC'
          import json
          from pathlib import Path
          spec = json.loads(Path("references/example-maintenance.app-spec.json").read_text(encoding="utf-8"))
          equipment = next(e for e in spec["entities"] if e["key"] == "equipment")
          equipment["fields"].append({"key": "location", "label": "Location", "type": "text", "searchable": True})
          spec["entities"].append({
              "key": "supplier", "label": "Supplier", "label_plural": "Suppliers", "title_field": "name",
              "fields": [{"key": "name", "label": "Name", "type": "text", "required": True}],
              "permissions": {role["key"]: ["list", "read"] for role in spec["roles"]},
          })
          Path("/tmp/v2.app-spec.json").write_text(json.dumps(spec, ensure_ascii=False, indent=2), encoding="utf-8")
          SPEC
          python scripts/evolve_app.py --project /tmp/evolving-app --spec /tmp/v2.app-spec.json --apply --migration-name ci_evolution

      - name: Apply the evolution migration
        run: cd /tmp/evolving-app && pnpm db:apply

      - name: The data survived and the new schema is live
        run: |
          cd /tmp/evolving-app
          node -e "
            const pg = require('pg');
            (async () => {
              const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              const kept = await c.query(\"SELECT location FROM equipment WHERE name = 'bomba-1'\");
              if (kept.rowCount !== 1) throw new Error('Los datos previos no sobrevivieron a la evolucion.');
              if (kept.rows[0].location !== null) throw new Error('La columna nueva deberia llegar vacia.');
              await c.query(\"INSERT INTO supplier (name) VALUES ('proveedor-1')\");
              const rls = await c.query(\"SELECT rowsecurity FROM pg_tables WHERE tablename = 'supplier'\");
              if (!rls.rows[0].rowsecurity) throw new Error('La entidad nueva nacio sin RLS.');
              await c.end();
              console.log('Datos preservados, columna agregada, entidad nueva cerrada.');
            })();
          "

      - name: Typecheck the evolved application
        run: cd /tmp/evolving-app && pnpm typecheck

      - name: Smoke every entity after evolving
        run: cd /tmp/evolving-app && pnpm db:smoke
